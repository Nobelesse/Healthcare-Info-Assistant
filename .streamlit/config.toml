[theme]
base = "dark"
primaryColor = "#24E8DB"
backgroundColor = "#06101F"
secondaryBackgroundColor = "#0D2034"
textColor = "#EAF8FF"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 12
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
