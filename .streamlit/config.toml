[theme]
base = "dark"
primaryColor = "#34BBA9"
backgroundColor = "#071928"
secondaryBackgroundColor = "#103344"
textColor = "#EAF9FB"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 12
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
# We use account-aware buttons in app.py, not Streamlit's automatic page list.
showSidebarNavigation = false
toolbarMode = "minimal"
